  <script src="script.js" defer></script>
  <script src="products.js" defer></script>
</head>
<body class="catalog-page">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header is-scrolled" data-header>
    <a class="wordmark" href="index.html" aria-label="아브라함문 홈">
      <span class="wordmark-mark" aria-hidden="true">AM</span>
      <span class="wordmark-name">아브라함문</span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-button>
      <span>메뉴</span><span class="menu-icon" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="주요 메뉴" data-nav>
      <a href="index.html#home">홈</a>
      <a href="about.html">내 소개</a>
      <a href="products.html" aria-current="page">제품</a>
      <a href="story/">이야기</a>
      <a href="index.html#contact">연락하기</a>
    </nav>
  </header>

  <main id="main">
    <section class="catalog-hero" aria-labelledby="catalog-title">
      <div class="reveal">
        <p class="section-label">Our collection</p>
        <h1 id="catalog-title">오래 두를수록<br>좋아지는 것들.</h1>
      </div>
      <div class="catalog-intro reveal">
        <p>아브라함문의 시그니처 한 점과 지금 함께 둘러보기 좋은 다섯 가지를 골랐습니다.</p>
        <p>Curated in Yorkshire</p>
      </div>
    </section>

    <section class="curated-catalog" aria-label="엄선한 제품 목록">
      <div data-product-feature>
        <p class="catalog-message">대표 상품 정보를 불러오는 중입니다.</p>
      </div>

      <div class="curated-grid-heading reveal">
        <p class="section-label">The edit</p>
        <h2>함께 고른 다섯 가지</h2>
      </div>
      <div class="catalog-grid" data-product-list data-curated data-limit="5">
        <p class="catalog-message">상품 정보를 불러오는 중입니다.</p>
      </div>
      <div class="catalog-store-cta reveal">
        <a href="https://brand.naver.com/supplyroute/category/df5af5ae3cc6471ca82983ab7759e112?cp=2" target="_blank" rel="noopener noreferrer">전체 제품 보기 →</a>

  <footer class="site-footer">
    <a class="wordmark" href="index.html"><span class="wordmark-mark" aria-hidden="true">AM</span><span class="wordmark-name">아브라함문</span></a>
    <p>좋은 울, 오래 남는 온기.</p>
    <p>© <span data-year></span> ABRAHAMMOON</p>
  </footer>
